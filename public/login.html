<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion — GestStock</title><link rel="stylesheet" href="/style.css?v=google-logo-v24"></head><body class="login-page"><section class="login-brand"><h1>◈ GestStock</h1><h2>Votre activité,<br>en toute simplicité.</h2><p>Stock, clients, fournisseurs et documents commerciaux réunis dans votre espace de gestion.</p><small>GESTION COMMERCIALE</small></section><main class="login-main"><div class="login-card"><span class="badge">Espace privé</span><h1 id="auth-title">Bienvenue</h1><p id="auth-description">Connectez-vous pour accéder à votre entreprise.</p><p id="auth-notice" role="status" hidden></p><a href="/api/google/start" id="google-login" class="google-login-button" hidden><svg class="google-logo" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M22.56 12.25c0-.73-.06-1.42-.19-2.09H12v3.96h5.92c-.26 1.28-1.04 2.36-2.21 3.08v2.56h3.57c2.08-1.92 3.28-4.75 3.28-7.51Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.56c-.98.66-2.24 1.05-3.71 1.05-2.86 0-5.29-1.93-6.16-4.53H2.15v2.64A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.31A6.6 6.6 0 0 1 5.5 12c0-.8.14-1.58.34-2.31V7.05H2.15A11 11 0 0 0 1 12c0 1.78.42 3.46 1.15 4.95l3.69-2.64Z"/><path fill="#EA4335" d="M12 5.16c1.62 0 3.07.56 4.21 1.65l3.16-3.16A10.6 10.6 0 0 0 12 1a11 11 0 0 0-9.85 6.05l3.69 2.64C6.71 7.09 9.14 5.16 12 5.16Z"/></svg><span>Continuer avec Google</span></a><form id="login-form"><label for="username">Nom d’utilisateur</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Mot de passe</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="show-password" class="secondary" aria-label="Afficher le mot de passe">Afficher</button></div><p id="login-error" role="alert"></p><button type="submit" id="login-submit">Se connecter →</button></form><nav class="login-links" aria-label="Accès au compte"><button type="button" class="secondary" data-auth-view="register">Créer un compte</button><button type="button" class="secondary" data-auth-view="forgot">Mot de passe oublié ?</button><button type="button" class="secondary" data-auth-view="resend">Renvoyer le lien de vérification</button></nav><form id="register-form" hidden><label>Nom complet<input name="name" autocomplete="name" maxlength="100" required></label><label>Nom d’utilisateur<input name="username" autocomplete="username" minlength="3" maxlength="80" pattern="[a-zA-Z0-9_.@-]{3,80}" required></label><label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Numéro de téléphone<input name="phone" type="tel" autocomplete="tel" maxlength="40" required placeholder="Ex. 0612345678 ou +212612345678"></label><label>Numéro WhatsApp<input name="whatsapp" type="tel" maxlength="40" required placeholder="Peut être identique au téléphone"></label><label>Mot de passe (16 caractères minimum)<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><label>Confirmer le mot de passe<input name="confirmPassword" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><p class="auth-error" role="alert"></p><button type="submit">Envoyer ma demande d’inscription</button><button type="button" class="secondary" data-auth-view="login">Retour à la connexion</button></form><form id="forgot-form" hidden><label>Email enregistré dans votre compte<input name="email" type="email" autocomplete="email" maxlength="254" required></label><p class="auth-error" role="alert"></p><button type="submit">Recevoir le lien par email</button><button type="button" class="secondary" data-auth-view="login">Retour à la connexion</button></form><form id="reset-form" hidden><label>Nouveau mot de passe (16 caractères minimum)<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><label>Confirmer le nouveau mot de passe<input name="confirmPassword" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><p class="auth-error" role="alert"></p><button type="submit">Réinitialiser mon mot de passe</button><button type="button" class="secondary" data-auth-view="forgot">Demander un nouveau lien</button></form><form id="resend-form" hidden><label>Email de votre inscription<input name="email" type="email" autocomplete="email" required></label><p class="auth-error" role="alert"></p><button type="submit">Renvoyer le lien</button><button type="button" class="secondary" data-auth-view="login">Retour à la connexion</button></form><form id="google-form" hidden><p id="google-profile-summary"></p><label>Nom d’utilisateur<input name="username" autocomplete="username" minlength="3" maxlength="80" pattern="[a-zA-Z0-9_.@-]{3,80}" required></label><label>Téléphone<input name="phone" type="tel" maxlength="40" autocomplete="tel" required></label><label>WhatsApp<input name="whatsapp" type="tel" maxlength="40" required></label><p class="auth-error" role="alert"></p><button type="submit">Envoyer mon inscription Google</button><button type="button" class="secondary" data-auth-view="login">Annuler</button></form><small id="login-session-note">Votre session expire après 8 heures.</small></div></main><script src="/login.js?v=google-logo-v24"></script></body></html>
