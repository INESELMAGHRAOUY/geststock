<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion — GestStock</title><link rel="stylesheet" href="/style.css?v=verified-google-v23"></head><body class="login-page"><section class="login-brand"><h1>◈ GestStock</h1><h2>Votre activité,<br>en toute simplicité.</h2><p>Stock, clients, fournisseurs et documents commerciaux réunis dans votre espace de gestion.</p><small>GESTION COMMERCIALE</small></section><main class="login-main"><div class="login-card"><span class="badge">Espace privé</span><h1 id="auth-title">Bienvenue</h1><p id="auth-description">Connectez-vous pour accéder à votre entreprise.</p><p id="auth-notice" role="status" hidden></p><a href="/api/google/start" id="google-login" class="google-login-button" hidden>Continuer avec Google</a><form id="login-form"><label for="username">Nom d’utilisateur</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Mot de passe</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="show-password" class="secondary" aria-label="Afficher le mot de passe">Afficher</button></div><p id="login-error" role="alert"></p><button type="submit" id="login-submit">Se connecter →</button></form><nav class="login-links" aria-label="Accès au compte"><button type="button" class="secondary" data-auth-view="register">Créer un compte</button><button type="button" class="secondary" data-auth-view="forgot">Mot de passe oublié ?</button><button type="button" class="secondary" data-auth-view="resend">Renvoyer le lien de vérification</button></nav><form id="register-form" hidden><label>Nom complet<input name="name" autocomplete="name" maxlength="100" required></label><label>Nom d’utilisateur<input name="username" autocomplete="username" minlength="3" maxlength="80" pattern="[a-zA-Z0-9_.@-]{3,80}" required></label><label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Numéro de téléphone<input name="phone" type="tel" autocomplete="tel" maxlength="40" required placeholder="Ex. 0612345678 ou +212612345678"></label><label>Numéro WhatsApp<input name="whatsapp" type="tel" maxlength="40" required placeholder="Peut être identique au téléphone"></label><label>Mot de passe (16 caractères minimum)<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><label>Confirmer le mot de passe<input name="confirmPassword" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><p class="auth-error" role="alert"></p><button type="submit">Envoyer ma demande d’inscription</button><button type="button" class="secondary" data-auth-view="login">Retour à la connexion</button></form><form id="forgot-form" hidden><label>Email enregistré dans votre compte<input name="email" type="email" autocomplete="email" maxlength="254" required></label><p class="auth-error" role="alert"></p><button type="submit">Recevoir le lien par email</button><button type="button" class="secondary" data-auth-view="login">Retour à la connexion</button></form><form id="reset-form" hidden><label>Nouveau mot de passe (16 caractères minimum)<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><label>Confirmer le nouveau mot de passe<input name="confirmPassword" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><p class="auth-error" role="alert"></p><button type="submit">Réinitialiser mon mot de passe</button><button type="button" class="secondary" data-auth-view="forgot">Demander un nouveau lien</button></form><form id="resend-form" hidden><label>Email de votre inscription<input name="email" type="email" autocomplete="email" required></label><p class="auth-error" role="alert"></p><button type="submit">Renvoyer le lien</button><button type="button" class="secondary" data-auth-view="login">Retour à la connexion</button></form><form id="google-form" hidden><p id="google-profile-summary"></p><label>Nom d’utilisateur<input name="username" autocomplete="username" minlength="3" maxlength="80" pattern="[a-zA-Z0-9_.@-]{3,80}" required></label><label>Téléphone<input name="phone" type="tel" maxlength="40" autocomplete="tel" required></label><label>WhatsApp<input name="whatsapp" type="tel" maxlength="40" required></label><p class="auth-error" role="alert"></p><button type="submit">Envoyer mon inscription Google</button><button type="button" class="secondary" data-auth-view="login">Annuler</button></form><small id="login-session-note">Votre session expire après 8 heures.</small></div></main><script src="/login.js?v=verified-google-v23"></script></body></html>
